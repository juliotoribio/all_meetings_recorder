[project]
name = "recorder-worker"
version = "0.1.0"
description = "Pipeline local: audio -> whisper.cpp -> Claude -> resumen"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "pydantic>=2.7",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "sherpa-onnx>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recorder = "recorder_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recorder_worker"]

[tool.pytest.ini_options]
markers = ["slow: usa whisper real (lento)"]
